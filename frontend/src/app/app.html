<mat-toolbar color="primary" class="main-header">
  <span>Meine To-Do-Liste</span>
  <mat-icon>calendar_today</mat-icon>
</mat-toolbar>
<main class="todo-container">
  <section class="neueAufgabe">
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Neue Aufgabe erstellen</mat-label>
      <input matInput #eingabeFeld>
    </mat-form-field>
    <button matButton="filled" (click)="aufgabeEinfuegen(eingabeFeld.value); eingabeFeld.value ='' ">speichern</button>
  </section>
  <div class="listen-container">
    <section class="aufgabenListe">
      <h2>Offene Aufgaben</h2>
      <mat-list role="list">
        @if (aufgaben().length < 1) {
          <mat-spinner></mat-spinner>
        }
        @for (aufgabe of aufgaben(); track aufgabe.id) {
          @if (!aufgabe.done) {
            <app-liste [aufgabe]="aufgabe"
                       (toggleIsDone)="toggleIsDone(aufgabe)"
                       (aufgabeLoeschen)="aufgabeLoeschen(aufgabe)">
            </app-liste>
          }
        }
      </mat-list>
    </section>
    <section class="aufgabenListe">
      <h2>Erledigte Aufgaben</h2>
      <mat-list role="list">
        @for (aufgabe of aufgaben(); track aufgabe.id) {
          @if (aufgabe.done) {
            <app-liste [aufgabe]="aufgabe"
                       (toggleIsDone)="toggleIsDone(aufgabe)"
                       (aufgabeLoeschen)="aufgabeLoeschen(aufgabe)">

            </app-liste>
          }
        }
      </mat-list>
    </section>
  </div>
</main>
